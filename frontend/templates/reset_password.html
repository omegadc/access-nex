{% extends "base_auth.html" %}
{% block subtitle %}Password Reset{% endblock %}
{% block content %}
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<h1>Choose a new password</h1>
<form method="post" action="/reset-password">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field"><label for="p">New Password</label><input type="password" id="p" name="new_password" autocomplete="new-password" minlength="8" required autofocus></div>
  <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
</form>
<div class="auth-footer"><a href="/login">← Back to sign in</a></div>
{% endblock %}
