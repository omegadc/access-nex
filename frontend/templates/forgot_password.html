{% extends "base_auth.html" %}
{% block subtitle %}Password Reset{% endblock %}
{% block content %}
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<h1>Forgot your password?</h1>
<p class="auth-hint">Enter your account email and we'll send you a reset link.</p>
<form method="post" action="/forgot-password">
  <div class="field"><label for="e">Email</label><input type="email" id="e" name="email" autocomplete="email" required autofocus></div>
  <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
</form>
<div class="auth-footer"><a href="/login">← Back to sign in</a></div>
{% endblock %}
