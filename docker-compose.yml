# Access-Nex + PostgreSQL. Copy .env.example to .env (and set a real
# POSTGRES_PASSWORD) before the first `docker compose up -d` — the db
# service's environment: block below refuses to start without it. Then run
# the CLI commands below (once) to create your first admin user and
# application.
#
# Three services: PostgreSQL, the Go backend (access-nex — OIDC/OAuth2
# protocol + JSON APIs, see docs/FRONTEND.md), and the Python/FastAPI
# frontend (every browser-facing page). Only the frontend publishes a host
# port — it's the single origin browsers talk to, proxying anything that
# isn't one of its own pages straight through to the backend over the
# compose network (http://access-nex:8080, no host.docker.internal needed
# since both containers share the network). This is the "same-origin via
# reverse proxy" topology docs/FRONTEND.md recommends, just built in instead
# of requiring a separate nginx/Caddy/Traefik.
#
# First-time setup:
#   cp .env.example .env && edit it
#   docker compose up -d
#   docker compose exec access-nex access-nex --db "postgres://accessnex:<POSTGRES_PASSWORD>@db:5432/accessnex?sslmode=disable" user add -u admin -p CHANGE_ME --admin --verified
#   docker compose exec access-nex access-nex --db "postgres://accessnex:<POSTGRES_PASSWORD>@db:5432/accessnex?sslmode=disable" app create -n "My App" -r https://your-app/callback
#
# Note: the access-nex image is distroless (no shell at all), so
# "--db \"$ACCESS_NEX_DB\"" can't be expanded inside `docker compose exec` —
# there's no shell there to expand it, and your host shell doesn't have that
# variable either (it only exists inside the container's own environment).
# Substitute the actual password from .env directly, as above.
#
# access-nex auto-initializes the local OIDC provider on first `server`
# start (using --issuer below), so no separate init step is needed for that.
# --issuer stays http://localhost:8080 (not the internal access-nex:8080)
# because that's the URL browsers and OAuth clients actually reach — it
# lands on the frontend, which proxies the OIDC/OAuth2 paths through.
#
# Why PostgreSQL (not the default SQLite) for the Docker deployment: with
# SQLite, `docker exec ... access-nex ...` admin commands run against the
# *same file* the long-running server process has open, and some Docker
# volume backends don't reliably surface one process's writes to another
# process's already-open connection on that file — writes and reads can
# silently miss each other. PostgreSQL is a real client-server database, so
# `docker compose exec` always sees consistent, current data. If you do run
# access-nex with SQLite in a container, manage users/apps through the
# /admin web UI instead of `docker exec` while the server is running.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: accessnex
      POSTGRES_USER: accessnex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file}
    volumes:
      - accessnex-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessnex"]
      interval: 5s
      timeout: 5s
      retries: 10

  access-nex:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No host port published: this is the backend now, reached only by the
    # frontend service (and `docker compose exec` for CLI commands) over the
    # compose network.
    volumes:
      # AES box key + signing key persist here regardless of --db.
      - accessnex-config:/data
    environment:
      ACCESS_NEX_DB: postgres://accessnex:${POSTGRES_PASSWORD:?}@db:5432/accessnex?sslmode=disable
    command:
      - server
      - --config=/data
      - --db=postgres://accessnex:${POSTGRES_PASSWORD:?}@db:5432/accessnex?sslmode=disable
      - --addr=:8080
      - --issuer=http://localhost:8080

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - access-nex
    ports:
      - "8080:8000"
    environment:
      ACCESS_NEX_BACKEND_URL: http://access-nex:8080

volumes:
  accessnex-db:
  accessnex-config:
