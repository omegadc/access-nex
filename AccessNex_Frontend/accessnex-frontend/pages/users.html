<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessNex — Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; display: none;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem; width: 380px; max-width: 95vw;
    }
    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 1.25rem; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="main-wrap">
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 class="page-title">Users</h1>
        <p class="page-sub">Manage registered users and roles</p>
      </div>
      <button class="btn btn-accent-dim" onclick="openModal()">+ Add user</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          All users
        </span>
      </div>
      <table>
        <thead>
          <tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="5" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add user modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <p class="modal-title" id="modalTitle">Add user</p>
      <div class="field"><label>Username</label><input type="text" id="fUsername" placeholder="username" /></div>
      <div class="field"><label>Email</label><input type="email" id="fEmail" placeholder="user@example.com" /></div>
      <div class="field" id="passwordField"><label>Password</label><input type="password" id="fPassword" placeholder="••••••••" /></div>
      <div class="field">
        <label>Role</label>
        <select id="fRole"><option value="user">User</option><option value="admin">Admin</option></select>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fActive"><option value="true">Active</option><option value="false">Inactive</option></select>
      </div>
      <p class="error-msg" id="modalErr"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitModal()">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    requireAuth();
    injectNav("users");

    let editingId = null;

    async function loadUsers() {
      const tbody = document.getElementById("usersBody");
      try {
        const users = await UsersAPI.list();
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:var(--text-muted);padding:1rem;text-align:center">No users yet. Add one above.</td></tr>`;
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr>
            <td class="td-name">${u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-blue' : 'badge-amber'}">${u.role}</span></td>
            <td><span class="badge ${u.is_active ? 'badge-green' : 'badge-red'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
            <td style="display:flex;gap:6px;">
              <button class="btn btn-ghost btn-sm" onclick="openEditModal(${u.id},'${u.username}','${u.email}','${u.role}',${u.is_active})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="error-msg" style="padding:1rem">Failed to load users: ${err.message}</td></tr>`;
      }
    }

    function openModal() {
      editingId = null;
      document.getElementById("modalTitle").textContent = "Add user";
      document.getElementById("fUsername").value = "";
      document.getElementById("fEmail").value = "";
      document.getElementById("fPassword").value = "";
      document.getElementById("fRole").value = "user";
      document.getElementById("fActive").value = "true";
      document.getElementById("passwordField").style.display = "block";
      document.getElementById("fUsername").removeAttribute("disabled");
      document.getElementById("modalErr").textContent = "";
      document.getElementById("modalOverlay").classList.add("open");
    }

    function openEditModal(id, username, email, role, isActive) {
      editingId = id;
      document.getElementById("modalTitle").textContent = "Edit user";
      document.getElementById("fUsername").value = username;
      document.getElementById("fUsername").setAttribute("disabled", true);
      document.getElementById("fEmail").value = email;
      document.getElementById("fRole").value = role;
      document.getElementById("fActive").value = String(isActive);
      document.getElementById("passwordField").style.display = "none";
      document.getElementById("modalErr").textContent = "";
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }
    function closeModalOutside(e) { if (e.target === document.getElementById("modalOverlay")) closeModal(); }

    async function submitModal() {
      const errEl = document.getElementById("modalErr");
      errEl.textContent = "";
      try {
        if (editingId) {
          await UsersAPI.update(editingId, {
            email: document.getElementById("fEmail").value,
            role: document.getElementById("fRole").value,
            is_active: document.getElementById("fActive").value === "true",
          });
          showToast("User updated successfully");
        } else {
          await UsersAPI.create({
            username: document.getElementById("fUsername").value,
            email: document.getElementById("fEmail").value,
            password: document.getElementById("fPassword").value,
            role: document.getElementById("fRole").value,
          });
          showToast("User created successfully");
        }
        closeModal();
        loadUsers();
      } catch (err) {
        errEl.textContent = err.message;
      }
    }

    async function deleteUser(id) {
      if (!confirm("Delete this user? This cannot be undone.")) return;
      try {
        await UsersAPI.delete(id);
        showToast("User deleted");
        loadUsers();
      } catch (err) {
        showToast("Failed to delete: " + err.message);
      }
    }

    loadUsers();
  </script>
</body>
</html>
