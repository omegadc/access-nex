<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessNex — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: 360px; }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .login-brand-name { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
    .login-card { background: var(--bg-surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; }
    .login-heading { font-size: 16px; font-weight: 600; margin-bottom: 0.25rem; }
    .login-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; }
    .login-btn { width: 100%; justify-content: center; margin-top: 0.25rem; padding: 9px; font-size: 14px; }
    .login-err { font-size: 12px; color: var(--danger); margin-top: 0.75rem; text-align: center; display: none; }
    .login-err.show { display: block; }
    .login-divider { margin: 1.25rem 0; display: flex; align-items: center; gap: 10px; }
    .login-divider span { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
    .login-oauth { width: 100%; justify-content: center; background: var(--bg-base); border: 0.5px solid var(--border); color: var(--text-secondary); padding: 9px; font-size: 13px; }
    .login-oauth:hover { border-color: var(--accent); color: var(--text-primary); }
    .login-hint { margin-top: 1.25rem; font-size: 12px; color: var(--text-muted); text-align: center; }
    .login-hint code { font-family: var(--font-mono); background: var(--bg-surface); padding: 1px 5px; border-radius: 4px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6l-8-4z"/></svg>
      </div>
      <span class="login-brand-name">AccessNex</span>
    </div>

    <div class="login-card">
      <h1 class="login-heading">Sign in</h1>
      <p class="login-sub">Multi-Factor Physical Access Control System</p>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary login-btn" onclick="doLogin()">Sign in</button>
      <p class="login-err" id="loginErr">Incorrect username or password.</p>

      <div class="login-divider"><span>or continue with</span></div>
      <button class="btn login-oauth" onclick="startOAuth()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>
        Sign in with OAuth provider
      </button>
    </div>

    <p class="login-hint">Connects to AccessNex backend at <code id="apiBaseLabel"></code></p>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("apiBaseLabel").textContent = API_BASE;
    if (Auth.isLoggedIn()) window.location.href = "pages/dashboard.html";

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl    = document.getElementById("loginErr");
      errEl.classList.remove("show");
      if (!username || !password) {
        errEl.textContent = "Please enter your username and password.";
        errEl.classList.add("show");
        return;
      }
      try {
        const data = await AuthAPI.login(username, password);
        Auth.setToken(data.access_token);
        window.location.href = "pages/dashboard.html";
      } catch (err) {
        errEl.textContent = err.message || "Incorrect username or password.";
        errEl.classList.add("show");
      }
    }

    /* Kick off OAuth flow via David's /authorize endpoint */
    function startOAuth() {
      const state = Math.random().toString(36).slice(2);
      sessionStorage.setItem("oauth_state", state);
      window.location.href = `${API_BASE}/authorize?response_type=code&client_id=accessnex-frontend&redirect_uri=${encodeURIComponent(window.location.origin + "/pages/oauth-callback.html")}&scope=openid+profile+email&state=${state}`;
    }

    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
