<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessNex — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap { width: 360px; }

    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .login-brand-icon {
      width: 38px; height: 38px; background: var(--accent-dim);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
    }
    .login-brand-icon svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 2; }
    .login-brand-name { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

    .login-card {
      background: var(--bg-surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.75rem;
    }
    .login-heading { font-size: 16px; font-weight: 600; margin-bottom: 0.25rem; }
    .login-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; }

    .login-btn { width: 100%; justify-content: center; margin-top: 0.25rem; padding: 9px; font-size: 14px; }
    .login-err { font-size: 12px; color: var(--danger); margin-top: 0.75rem; text-align: center; display: none; }
    .login-err.show { display: block; }

    .login-hint { margin-top: 1.25rem; font-size: 12px; color: var(--text-muted); text-align: center; }
    .login-hint code { font-family: var(--font-mono); background: var(--bg-base); padding: 1px 5px; border-radius: 4px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6l-8-4z"/></svg>
      </div>
      <span class="login-brand-name">AccessNex</span>
    </div>

    <div class="login-card">
      <h1 class="login-heading">Sign in</h1>
      <p class="login-sub">Multi-Factor Physical Access System</p>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary login-btn" onclick="doLogin()">Sign in</button>
      <p class="login-err" id="loginErr">Incorrect username or password.</p>
    </div>

    <p class="login-hint">
      Default credentials: <code>gopesh</code> / <code>admin123</code>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    /* Redirect if already logged in */
    if (Auth.isLoggedIn()) window.location.href = "pages/dashboard.html";

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("loginErr");
      errEl.classList.remove("show");

      if (!username || !password) {
        errEl.textContent = "Please enter your username and password.";
        errEl.classList.add("show");
        return;
      }

      try {
        const data = await AuthAPI.login(username, password);
        Auth.setToken(data.access_token);
        window.location.href = "pages/dashboard.html";
      } catch (err) {
        errEl.textContent = err.message || "Incorrect username or password.";
        errEl.classList.add("show");
      }
    }

    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
