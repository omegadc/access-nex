openapi: 3.0.3
info:
  title: Access-Nex
  description: >
    Self-hosted OAuth2 / OpenID Connect provider. This document covers the
    JSON surface a client application (including a separately-hosted
    frontend — see docs/FRONTEND.md) can build against: the standard
    OIDC/OAuth2 endpoints, the /api/v1 account API, and the /api/admin
    management API. The server-rendered HTML pages (/login, /portal, /admin,
    /device) are not part of this contract — they exist for zero-setup
    browser use and can be replaced entirely by a custom frontend calling
    these APIs.
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Default local install

security:
  - sessionCookie: []

paths:
  # ── OIDC / OAuth2 core ────────────────────────────────────────────────────
  /.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      security: []
      responses:
        "200":
          description: Discovery metadata
          content:
            application/json:
              schema: { type: object }

  /jwks:
    get:
      summary: JSON Web Key Set (all non-retired signing keys)
      security: []
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema: { type: object }

  /authorize:
    get:
      summary: Authorization endpoint (browser navigation, not an API call)
      description: >
        Standard OAuth2/OIDC authorization request. Not JSON — this is a
        browser-navigated flow that ends in a redirect (or a login/consent/
        2FA HTML page along the way) per RFC 6749/OIDC Core. A custom
        frontend still navigates the browser here for the OAuth dance
        itself; only account management (login, 2FA, consent history) has a
        JSON equivalent under /api/v1.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, schema: { type: string } }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256, plain] } }
        - { name: response_mode, in: query, schema: { type: string, enum: [query, form_post] } }
        - { name: prompt, in: query, schema: { type: string, enum: [none, login, consent, select_account] } }
      responses:
        "302": { description: Redirect to redirect_uri with code (or error), or to the login page }
        "200": { description: Login, 2FA, or consent HTML page }

  /token:
    post:
      summary: Token endpoint
      security:
        - clientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:device_code
                    - urn:ietf:params:oauth:grant-type:token-exchange
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string, description: "PKCE verifier" }
                refresh_token: { type: string }
                scope: { type: string }
                audience: { type: string, description: "Repeatable; extra audiences for the issued token" }
                device_code: { type: string }
                subject_token: { type: string, description: "Token exchange only" }
                subject_token_type: { type: string, description: "urn:ietf:params:oauth:token-type:access_token" }
                client_id: { type: string }
                client_secret: { type: string }
      parameters:
        - name: DPoP
          in: header
          required: false
          schema: { type: string }
          description: RFC 9449 sender-constrained token proof (optional)
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer, DPoP] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  id_token: { type: string, description: "JWT, or a JWE compact string if the client registered an ID-token encryption key" }
                  scope: { type: string }
        "400":
          description: >
            OAuth error (invalid_grant, invalid_request, authorization_pending,
            slow_down, access_denied, expired_token, use_dpop_nonce, ...)

  /userinfo:
    get:
      summary: Claims for the presented access token
      security:
        - bearerToken: []
        - dpopToken: []
      parameters:
        - name: DPoP
          in: header
          required: false
          schema: { type: string }
          description: Required (fresh, per-request) if the token is DPoP-bound
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema: { type: object }
        "401": { description: Invalid, expired, or wrong-scheme token }

  /introspect:
    post:
      summary: RFC 7662 token introspection
      security: [{ clientBasic: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { token: { type: string } } }
      responses:
        "200": { description: "{ active: bool, ... }" }

  /revoke:
    post:
      summary: RFC 7009 token revocation
      security: [{ clientBasic: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { token: { type: string } } }
      responses:
        "200": { description: Revoked (idempotent) }

  /register:
    post:
      summary: RFC 7591 dynamic client registration
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name: { type: string }
                redirect_uris: { type: array, items: { type: string } }
                token_endpoint_auth_method: { type: string, enum: [client_secret_basic, none] }
      responses:
        "201":
          description: Registered client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  client_secret: { type: string }

  /device_authorize:
    post:
      summary: RFC 8628 device authorization grant — start
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: { client_id: { type: string }, scope: { type: string } }
      responses:
        "200":
          description: Device + user codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  verification_uri: { type: string }
                  verification_uri_complete: { type: string }
                  expires_in: { type: integer }
                  interval: { type: integer }

  # ── /api/v1: account API for a custom frontend ─────────────────────────────
  /api/v1/login:
    post:
      summary: Password login (step 1)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { username: { type: string }, password: { type: string } }
      responses:
        "200":
          description: Signed in, or a 2FA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { status: { type: string, enum: [signed_in] } }
                  - type: object
                    properties:
                      status: { type: string, enum: [2fa_required] }
                      token: { type: string, description: "pass to /api/v1/login/totp or /login/webauthn/*" }
                      methods: { type: array, items: { type: string, enum: [totp, webauthn] } }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited }

  /api/v1/login/totp:
    post:
      summary: Password login (step 2, TOTP)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string }, code: { type: string } }
      responses:
        "200": { description: Signed in; sets the session cookie }
        "401": { description: Invalid code }

  /login/webauthn/begin:
    post:
      summary: Password login (step 2, security key) — get assertion options
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { token: { type: string } } }
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialRequestOptions
          content:
            application/json:
              schema:
                type: object
                properties: { waToken: { type: string }, publicKey: { type: object } }

  /login/webauthn/finish:
    post:
      summary: Password login (step 2, security key) — verify assertion
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                waToken: { type: string }
                credential: { type: object, description: "PublicKeyCredential.toJSON() from navigator.credentials.get()" }
      responses:
        "200": { description: Signed in; sets the session cookie }
        "400": { description: Verification failed }

  /api/v1/logout:
    post:
      summary: End the current session
      security: []
      responses: { "200": { description: Signed out } }

  /api/v1/me:
    get:
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  username: { type: string }
                  name: { type: string }
                  email: { type: string }
                  email_verified: { type: boolean }
                  is_admin: { type: boolean }
                  totp_enabled: { type: boolean }
                  provider_id: { type: string, description: "empty for local accounts" }

  /api/v1/grants:
    get:
      summary: Applications this user has authorized
      responses: { "200": { description: "{ grants: [...] }" } }

  /api/v1/grants/{client_id}:
    delete:
      summary: Revoke consent for an application
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Revoked } }

  /api/v1/sessions:
    get:
      summary: This user's active sessions (other devices included)
      responses: { "200": { description: "{ sessions: [...] }" } }

  /api/v1/sessions/{id}:
    delete:
      summary: End a session (sign out that device)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Revoked } }

  /api/v1/identities:
    get:
      summary: Linked external-provider identities
      responses: { "200": { description: "{ identities: [...] }" } }

  /api/v1/identities/{id}:
    delete:
      summary: Unlink an external identity
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Unlinked }
        "409": { description: Refused — this is the account's only sign-in method }

  /api/v1/password:
    post:
      summary: Change password (while signed in)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } }
      responses:
        "200": { description: Changed }
        "401": { description: Current password incorrect }

  /api/v1/email/resend-verification:
    post:
      summary: Resend the email verification link
      responses: { "200": { description: Sent } }

  /api/v1/forgot-password:
    post:
      summary: Request a password reset email
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string } } }
      responses:
        "200":
          description: >
            Always returns { status: if_exists_email_sent } regardless of
            whether the address matched an account, to avoid user enumeration.

  /api/v1/reset-password:
    post:
      summary: Complete a password reset (token from the emailed link)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string }, new_password: { type: string, minLength: 8 } }
      responses:
        "200": { description: Changed }
        "400": { description: Link invalid or expired }

  /portal/webauthn/register/begin:
    post:
      summary: Register a new passkey/security key (step 1, requires a session)
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialCreationOptions
          content:
            application/json:
              schema:
                type: object
                properties: { token: { type: string }, publicKey: { type: object } }

  /portal/webauthn/register/finish:
    post:
      summary: Register a new passkey/security key (step 2)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                name: { type: string, description: "user-facing label" }
                credential: { type: object, description: "PublicKeyCredential.toJSON() from navigator.credentials.create()" }
      responses:
        "201": { description: Registered }

  # ── /api/admin: management API (admin session required) ────────────────────
  /api/admin/users:
    get:
      summary: List users
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "{ users: [...] }" } }
    post:
      summary: Create a user
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminApiHeader" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string }
                name: { type: string }
                is_admin: { type: boolean }
      responses: { "201": { description: Created } }

  /api/admin/users/{username}:
    delete:
      summary: Delete a user
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AdminApiHeader" }
      responses: { "200": { description: Deleted } }

  /api/admin/apps:
    get:
      summary: List applications
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "{ apps: [...] }" } }
    post:
      summary: Create an application
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminApiHeader" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                redirect_uris: { type: array, items: { type: string } }
                public: { type: boolean }
                provider_id: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created (secret shown once)
          content:
            application/json:
              schema:
                type: object
                properties: { client_id: { type: string }, client_secret: { type: string } }

  /api/admin/apps/{id}:
    delete:
      summary: Delete an application
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AdminApiHeader" }
      responses: { "200": { description: Deleted } }

  /api/admin/providers:
    get:
      summary: List external providers
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "{ providers: [...] }" } }

  /api/admin/providers/{id}:
    delete:
      summary: Delete an external provider
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AdminApiHeader" }
      responses: { "200": { description: Deleted } }

  /api/admin/audit:
    get:
      summary: Recent audit log entries
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses: { "200": { description: "{ audit: [...] }" } }

  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses: { "200": { description: text/plain Prometheus exposition format } }

components:
  parameters:
    AdminApiHeader:
      name: X-Access-Nex-Admin
      in: header
      required: true
      schema: { type: string, enum: ["1"] }
      description: Required on mutating /api/admin requests (CSRF defense-in-depth alongside SameSite cookies + per-origin CORS)
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oidc_sid
      description: >
        Set by /login, /api/v1/login(+totp), or /login/webauthn/finish.
        Mutating /api/v1 and /api/admin requests additionally require the
        X-Access-Nex-Api / X-Access-Nex-Admin header respectively.
    clientBasic:
      type: http
      scheme: basic
      description: OAuth2 client_id:client_secret (confidential clients); public clients omit auth entirely
    bearerToken:
      type: http
      scheme: bearer
    dpopToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'For DPoP-bound tokens: "Authorization: DPoP <token>" plus a DPoP proof header'
